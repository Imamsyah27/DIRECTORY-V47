name: Build and deploy DIRECTORY-V8 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "DIRECTORY-V8-GitHub-Pages-Bundle.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract website bundle
        run: | unzip -q DIRECTORY-V8-GitHub-Pages-Bundle.zip -d source test -f source/pelanggan-react/package.json test -d source/pelanggan 
      - name: Build React dashboard
        working-directory: source/pelanggan-react
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: | npm install npm run build -- --base="/${REPO_NAME}/pelanggan-react/" 
      - name: Assemble GitHub Pages site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: | mkdir -p _site cp -R source/index.html source/*.css source/*.js source/js source/pelanggan _site/ mkdir -p _site/pelanggan-react cp -R source/pelanggan-react/dist/. _site/pelanggan-react/ cat > _site/index.html <<EOF <!doctype html> <html lang="id"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <meta http-equiv="refresh" content="0;url=./pelanggan-react/"> <title>DIRECTORY Customer Portal</title> </head> <body> <p>Membuka Dashboard Pelanggan… <a href="./pelanggan-react/">Lanjutkan</a></p> </body> </html> EOF touch _site/.nojekyll 
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
